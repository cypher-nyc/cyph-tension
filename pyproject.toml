# The Python face of the model (`tension`), installable so a service can call
# the one model instead of copying it. It carries no compiled code: the
# library is built from haskell/ (`make -C haskell lib`, GHC) and found
# through CYPH_TENSION_LIB, or next to this checkout by default.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cyph-tension"
version = "0.2.0"
description = "The productive-tension model: who should talk to whom, and what to put in front of someone."
requires-python = ">=3.10"
license = { text = "MPL-2.0" }
dependencies = []

[tool.setuptools]
packages = ["tension"]
